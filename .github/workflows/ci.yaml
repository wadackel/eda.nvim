name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-nix
      - name: Lint
        run: |
          eval "$(nix print-dev-env .#ci)"
          just format-check
          just lint

  test:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            neovim: v0.11.0
            label: v0.11.0
          - os: ubuntu-latest
            neovim: stable
            label: stable
          - os: ubuntu-latest
            neovim: nightly
            label: nightly
          - os: macos-15
            neovim: stable
            label: macos-15, stable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Prepare isolated test directories
        run: |
          for kind in CONFIG DATA STATE CACHE; do
            printf 'XDG_%s_HOME=%s/eda-test-%s\n' "$kind" "$RUNNER_TEMP" "$kind"
          done >> "$GITHUB_ENV"
      - name: Record Neovim version
        run: |
          command -v nvim
          nvim --version
      - name: Run tests
        run: nvim --headless -l tests/minit.lua
      - name: Run E2E tests
        run: nvim --headless -l tests/e2e_minit.lua

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-nix
      - name: Typecheck
        run: nix develop .#typecheck --command just typecheck

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-nix
      - name: Generate vimdoc
        run: |
          eval "$(nix print-dev-env .#ci)"
          GITHUB_ACTIONS= just doc
      - name: Check vimdoc is up to date
        run: git diff --exit-code doc/eda.nvim.txt
